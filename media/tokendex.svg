<!--
  Activity bar / view icon. Original drawing on purpose: no Pokémon asset ships with this
  extension (see the licence note in the README).

  VS Code uses this file as a MASK tinted with the theme colour, so only the alpha matters —
  and at 16-24px a single thin-stroke silhouette is what survives. The motif mirrors
  media/icon.png: the cracked lower half of the egg with the bolt of spent tokens bursting
  out of it.
-->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shifted up 0.6 and stroked heavier: the motif's visual mass is the bottom-half shell, so
       a geometrically centred drawing reads as sunk next to codicons; the lift centres it
       optically, and 1.9 at this 24-box matches codicon stroke weight once scaled to 16px. -->
  <path stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"
        d="M5.4 10.6c-.4 1.3-.65 2.55-.65 3.6 0 3.85 3.25 6.55 7.25 6.55s7.25-2.7 7.25-6.55c0-1.05-.25-2.3-.65-3.6l-2.2 1.7-2.2-1.7-2.2 1.7-2.2-1.7-2.2 1.7Z"/>
  <path fill="currentColor" d="M14.1 .8 8.8 9h2.7l-1.4 5 5.3-7.7h-2.8l1.5-5.5Z"/>
</svg>
